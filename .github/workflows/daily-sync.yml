name: Daily sync

on:
  schedule:
    - cron: "17 2 * * *" # every day at 02:17 UTC (off the hour: GitHub drops many top-of-hour schedules)
  workflow_dispatch: # "Run workflow" button for manual runs
  push:
    branches: [main] # tests only (the sync job is skipped on push)

# Never let two syncs touch the File Search store at the same time.
concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  sync:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t kb-sync-bot .

      - name: Scrape and upload delta
        env:
          API_KEY: ${{ secrets.API_KEY }}
          STORE_ID: ${{ secrets.STORE_ID }}
        run: |
          mkdir -p out
          docker run --rm -e API_KEY -e STORE_ID -v "$PWD/out:/app/articles" kb-sync-bot main.py

      - name: Publish run summary
        if: always()
        run: |
          if [ -f out/last_run.json ]; then
            { echo "### Last run"; echo '```json'; cat out/last_run.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run artefact (report + Markdown)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-${{ github.run_number }}
          path: out/
          retention-days: 30
